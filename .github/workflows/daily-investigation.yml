name: Daily Investigation

on:
  schedule:
    # Runs at 12:17 AM, 8:17 AM, and 4:17 PM Eastern Time.
    # America/New_York keeps the schedule aligned through EST/EDT changes.
    - cron: "17 0,8,16 * * *"
      timezone: "America/New_York"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-investigation
  cancel-in-progress: false

jobs:
  investigation:
    name: Generate Daily Investigation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      ###############################################################
      # Repository Setup
      ###############################################################

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"

      - name: Set Up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Display Python Version
        run: python --version

      - name: Display .NET Version
        run: dotnet --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "openpyxl==3.1.5" \
            "Pillow==12.3.0" \
            "numpy==2.5.2" \
            "opencv-python-headless==5.0.0.93"

      ###############################################################
      # Phase I — Investigation Generation
      ###############################################################

      - name: Repair Legacy Correlation Linkage (Idempotent)
        run: python scripts/migrate_legacy_correlation_linkage.py

      - name: Generate or Reuse Persistent Investigation
        run: python scripts/generate_case.py

      - name: Update Active Operation
        run: python scripts/update_operation.py

      - name: Generate Digital Evidence Repository
        run: python scripts/generate_evidence_repository.py

      - name: Correlate Evidence and Indicators
        run: python scripts/correlate_evidence.py

      - name: Run Initial C# Bioterror Threat Scoring Engine
        run: dotnet run --project tools/BioterrorThreatScoringEngine.csproj --configuration Release

      - name: Process Active Case Stage Work
        run: python scripts/process_active_case_stage.py

      - name: Evaluate Persistent Lifecycle Once
        run: python scripts/update_case_progress.py

      - name: Refresh C# Score After Lifecycle Evaluation
        run: dotnet run --project tools/BioterrorThreatScoringEngine.csproj --configuration Release

      - name: Synchronize Final Case Support State
        run: python scripts/synchronize_case_support_state.py

      - name: Archive Terminal Investigation Only
        run: python scripts/archive_case.py

      - name: Refresh C# Score After Possible Archive
        run: dotnet run --project tools/BioterrorThreatScoringEngine.csproj --configuration Release

      - name: Synchronize Post-Archive Case Support State
        run: python scripts/synchronize_case_support_state.py

      - name: Update Investigation History
        run: python scripts/update_history.py

      ###############################################################
      # Campaign Metrics
      #
      # This must run after update_history.py because the current
      # investigation must be present in the CSV before totals are
      # recalculated.
      ###############################################################

      - name: Recalculate Campaign Metrics
        run: python scripts/recalculate_campaign_metrics.py

      ###############################################################
      # Phase II — Evidence Collection
      ###############################################################

      - name: Update Evidence Database
        run: python scripts/update_evidence.py

      - name: Update Investigation Timeline
        run: python scripts/update_timeline.py

      - name: Update Investigation Workbook
        run: python scripts/update_workbook.py

      ###############################################################
      # Phase III — Intelligence Production
      ###############################################################

      - name: Generate Investigation Findings
        run: python scripts/update_findings.py

      - name: Generate Operational Assessment
        run: python scripts/update_assessment.py

      - name: Generate Campaign Summary
        run: python scripts/update_campaign_summary.py

      - name: Generate Threat Actor Profile
        run: python scripts/update_actor_profile.py

      - name: Update Threat Actor Database
        run: python scripts/update_actor_database.py

      - name: Update IOC Database
        run: python scripts/update_ioc_database.py

      ###############################################################
      # Phase IV — Forensic Reconstruction
      ###############################################################

      - name: Generate Device Profile
        run: python scripts/update_device_profile.py

      - name: Generate Forensic Summary
        run: python scripts/update_forensic_summary.py

      ###############################################################
      # Phase V — Reports and Dashboard
      #
      # The combined report runs after all source intelligence,
      # evidence, and forensic files have been regenerated.
      ###############################################################

      - name: Generate Biothreat Report
        run: python scripts/generate_biothreat_report.py

      - name: Verify renderer hash
        run: |
         sha256sum scripts/consolidated_dashboard_renderer.py
         grep -n '"severity":' scripts/consolidated_dashboard_renderer.py | tail -5
         sed -n '1177,1185p' scripts/consolidated_dashboard_renderer.py

      - name: Generate Investigation Dashboard
        run: python scripts/generate_case_dashboard.py

      - name: Generate Command Brief
        run: python scripts/generate_command_brief.py

      - name: Generate Investigation Timeline
        run: python scripts/generate_investigation_timeline.py

      - name: Generate Evidence Chain
        run: python scripts/generate_evidence_chain.py

      - name: Generate Chain of Custody
        run: python scripts/generate_chain_of_custody.py

      - name: Generate Forensic Summary
        run: python scripts/generate_forensic_summary.py

      - name: Generate Investigative Leads
        run: python scripts/generate_investigative_leads.py

      - name: Generate Bioterror Threat Assessment
        run: python scripts/generate_bioterror_threat_assessment.py

      - name: Generate Dynamic Case Banner
        run: python scripts/generate_case_banner.py

      - name: Generate Production Dashboard Proof
        run: python scripts/generate_subsystem10_production_proof.py

      - name: Generate Cyber-Biothreat Investigation Report
        run: python scripts/generate_investigation_report.py

      - name: Update README
        run: python scripts/update_readme.py

      - name: Validate README Structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          readme_path = Path("README.md")
          case_path = Path("data/current_case.json")

          if not readme_path.exists():
              raise SystemExit("README validation failed: README.md is missing.")

          text = readme_path.read_text(encoding="utf-8")

          with case_path.open("r", encoding="utf-8") as file:
              case = json.load(file)

          required_markers = (
              "<!-- FSE-REPORT-START -->",
              "<!-- FSE-REPORT-END -->",
              "## Case File Access",
          )

          for marker in required_markers:
              if marker not in text:
                  raise SystemExit(
                      f"README validation failed: missing required marker {marker!r}."
                  )

          paired_tags = (
              ("<table>", "</table>", "HTML table"),
              ("<details>", "</details>", "details block"),
              ("<summary>", "</summary>", "summary block"),
          )

          for opening, closing, label in paired_tags:
              opening_count = text.count(opening)
              closing_count = text.count(closing)

              if opening_count != closing_count:
                  raise SystemExit(
                      "README validation failed: "
                      f"{label} count mismatch "
                      f"({opening_count} open / {closing_count} close)."
                  )

          case_id = str(case.get("case_id", "")).strip()
          current_stage = str(case.get("current_stage", "")).strip()
          lifecycle_status = str(
              case.get("lifecycle_status", "")
          ).strip()

          if not case_id or case_id not in text:
              raise SystemExit(
                  "README validation failed: active Case ID is not present."
              )

          stage_display = current_stage.replace("_", " ").upper()
          lifecycle_display = lifecycle_status.replace("_", " ").upper()

          if current_stage and stage_display not in text:
              raise SystemExit(
                  "README validation failed: current lifecycle stage is missing."
              )

          if lifecycle_status and lifecycle_display not in text:
              raise SystemExit(
                  "README validation failed: lifecycle status is missing."
              )

          print(
              "README structure validation passed: "
              f"{text.count('<table>')} tables, "
              f"{text.count('<details>')} expandable sections, "
              f"case={case_id}, "
              f"stage={stage_display or 'UNKNOWN'}, "
              f"lifecycle={lifecycle_display or 'UNKNOWN'}."
          )
          PY

      ###############################################################
      # Validation
      ###############################################################

      - name: Validate Generated JSON
        run: |
          python -m json.tool data/current_case.json > /dev/null
          python -m json.tool operations/active_operation.json > /dev/null
          python -m json.tool operations/operation_status.json > /dev/null
          python -m json.tool intelligence/actor_database.json > /dev/null
          python -m json.tool reports/bioterror_threat_score_csharp.json > /dev/null

      - name: Validate C# XML and Dynamic Banner
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          from PIL import Image

          xml_path = Path(
              "reports/bioterror_threat_score_csharp.xml"
          )
          banner_path = Path(
              "assets/biodefense-case-scan.gif"
          )

          if not xml_path.exists():
              raise SystemExit(
                  "Validation failed: missing C# XML threat assessment."
              )

          xml_root = ET.parse(xml_path).getroot()

          if xml_root.tag != "BioterrorThreatAssessment":
              raise SystemExit(
                  "Validation failed: unexpected XML root element "
                  f"{xml_root.tag!r}."
              )

          if not banner_path.exists():
              raise SystemExit(
                  "Validation failed: dynamic case banner was not generated."
              )

          if banner_path.stat().st_size == 0:
              raise SystemExit(
                  "Validation failed: dynamic case banner is empty."
              )

          with Image.open(banner_path) as image:
              frame_count = getattr(image, "n_frames", 1)

              if image.format != "GIF":
                  raise SystemExit(
                      "Validation failed: banner output is not a GIF."
                  )

              if frame_count < 2:
                  raise SystemExit(
                      "Validation failed: banner GIF is not animated."
                  )

              width, height = image.size

          print(
              "C# XML validation passed: "
              f"{xml_path}"
          )
          print(
              "Dynamic banner validation passed: "
              f"{width}x{height}, "
              f"{frame_count} frames."
          )
          PY

      - name: Validate Digital Evidence Repository
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          case_path = Path("data/current_case.json")

          with case_path.open("r", encoding="utf-8") as file:
              case = json.load(file)

          case_id = case.get("case_id")

          if not case_id:
              raise SystemExit(
                  "Evidence validation failed: current case has no case_id."
              )

          evidence_directory = Path("evidence") / case_id
          manifest_path = evidence_directory / "evidence_manifest.json"
          custody_path = evidence_directory / "chain_of_custody.csv"
          summary_path = evidence_directory / "acquisition_summary.md"
          artifacts_directory = evidence_directory / "artifacts"
          correlations_path = (
              evidence_directory
              / "evidence_correlations.json"
          )

          required_artifacts = [
              artifacts_directory / "firewall_log.json",
              artifacts_directory / "access_control_log.json",
              artifacts_directory / "device_configuration.json",
              artifacts_directory / "analyst_notes.md",
          ]

          required_paths = [
              manifest_path,
              correlations_path,
              custody_path,
              summary_path,
              artifacts_directory,
              *required_artifacts,
          ]

          missing_paths = [
              str(path)
              for path in required_paths
              if not path.exists()
          ]

          if missing_paths:
              missing_text = "\n".join(
                  f"- {path}" for path in missing_paths
              )
              raise SystemExit(
                  "Evidence validation failed. Missing files:\n"
                  f"{missing_text}"
              )

          with manifest_path.open("r", encoding="utf-8") as file:
              manifest = json.load(file)

          expected_count = int(case.get("evidence_count", 0))
          evidence_items = manifest.get("evidence_items", [])
          actual_count = len(evidence_items)

          if manifest.get("case_id") != case_id:
              raise SystemExit(
                  "Evidence validation failed: manifest case ID "
                  "does not match the current case."
              )

          if expected_count != actual_count:
              raise SystemExit(
                  "Evidence validation failed: "
                  f"current_case.json contains {expected_count} evidence "
                  f"items, but the manifest contains {actual_count}."
              )

          manifest_count = int(
              manifest.get("evidence_count", actual_count)
          )

          if manifest_count != actual_count:
              raise SystemExit(
                  "Evidence validation failed: the manifest evidence_count "
                  "does not match the number of evidence records."
              )

          evidence_ids = [
              item.get("evidence_id")
              for item in evidence_items
          ]

          if any(not evidence_id for evidence_id in evidence_ids):
              raise SystemExit(
                  "Evidence validation failed: at least one evidence "
                  "record has no evidence_id."
              )

          if len(evidence_ids) != len(set(evidence_ids)):
              raise SystemExit(
                  "Evidence validation failed: duplicate evidence IDs "
                  "were found."
              )

          print(
              f"Evidence validation passed for {case_id}: "
              f"{actual_count} records."
          )
          PY

      - name: Display Investigation Summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          case_path = Path("data/current_case.json")
          operation_path = Path("operations/active_operation.json")

          with case_path.open("r", encoding="utf-8") as file:
              case = json.load(file)

          with operation_path.open("r", encoding="utf-8") as file:
              operation = json.load(file)

          case_id = case.get("case_id", "Unknown")
          evidence_count = case.get("evidence_count", 0)
          evidence_path = Path("evidence") / case_id

          print("Investigation generated successfully")
          print(f"Case ID: {case_id}")
          print(f"Severity: {case.get('severity', 'Unknown')}")
          print(f"Evidence items: {evidence_count}")
          print(f"Indicators: {case.get('ioc_count', 0)}")
          print(f"Evidence repository: {evidence_path}")
          print(f"Campaign cases: {operation.get('active_cases', 0)}")
          print(
              "Campaign evidence: "
              f"{operation.get('evidence_collected', 0)}"
          )
          print(
              "Campaign indicators: "
              f"{operation.get('ioc_count', 0)}"
          )
          PY

      ###############################################################
      # Commit Generated Changes
      ###############################################################

      - name: Commit Investigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --staged --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Daily investigation update"
            git push
          fi
